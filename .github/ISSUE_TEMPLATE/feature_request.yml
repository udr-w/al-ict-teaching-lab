name: Feature or teaching improvement
description: Suggest an improvement to tooling, curriculum workflow, lesson design, assessment, or student experience
title: "[Idea]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What teaching, workflow, or technical problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the outcome you want. Implementation ideas are welcome but not required.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Curriculum and sequencing
        - Lesson and slide design
        - Practical assessment
        - Written assessment
        - Student experience and accessibility
        - Rendering and publication
        - Developer tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting context
      description: Add syllabus references, screenshots, examples, or test evidence where useful. Do not include private learner data.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This request contains no student-identifiable information, credentials, or other private data.
          required: true
