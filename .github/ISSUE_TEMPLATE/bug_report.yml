name: Bug report
description: Report a reproducible problem in the teaching lab tooling or generated materials
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include student-identifiable data, credentials, private assessment data, or security-sensitive details.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem clearly and concisely.
      placeholder: Tell us what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible sequence you can.
      placeholder: |
        1. Run ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python/Node versions, relevant command, lesson/competency ID, or renderer details.
  - type: textarea
    id: verification
    attributes:
      label: Logs or evidence
      description: Paste only non-sensitive logs, screenshots, test output, or file paths that help reproduce the issue.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed student-identifiable information, credentials, and other private data.
          required: true
