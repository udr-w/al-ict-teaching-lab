lesson:
  id: unit-01-competency-1.3
  title: Modelling Information with Input Process and Output
  unit: 1
  competency: "1.3"
  status: ready-for-review
  allocated_periods: 4
  prerequisites: ["1.1", "1.2"]
  curriculum_source: {id: nie-gce-al-ict-syllabus-revised-2013-en, printed_page: 7}
  learning_outcomes:
    - {id: LO-1, statement: Represent an information task using an input-process-output model.}
    - {id: LO-2, statement: Evaluate whether an input-process-output model is complete and appropriate.}
    - {id: LO-3, statement: Explain how timeliness affects information value.}
    - {id: LO-4, statement: Evaluate whether a computer is appropriate for a specified information task.}
  success_criteria:
    - Each model identifies specific inputs transformations and outputs.
    - Evaluation identifies assumptions omissions or unsuitable transformations.
    - Recommendations balance speed consistency scale judgement cost and context.
  sequence:
    - {period: 1, phase: activate, focus: Build an input-process-output model, outcomes: [LO-1]}
    - {period: 2, phase: explain, focus: Test model completeness and compliance with an ICT task, outcomes: [LO-2]}
    - {period: 3, phase: practise, focus: Time value of information, outcomes: [LO-3]}
    - {period: 4, phase: assess-and-reflect, focus: Computer appropriateness case study, outcomes: [LO-1, LO-2, LO-3, LO-4]}
  assessment: {diagnostic: Everyday-process model, formative: Worksheet and practical model review, summative: Homework case analysis}
