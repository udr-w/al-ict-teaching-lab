<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 570" role="img" aria-labelledby="t d"><title id="t">Evidence ladder</title><desc id="d">Calculation, comparison and contextual conclusion require increasing context and judgement.</desc><rect width="1100" height="570" rx="24" fill="#f0f6f8"/><path d="M120 470H420V350H700V230H980V470Z" fill="#dff3f2" stroke="#007f86" stroke-width="6"/><g font-family="Arial" fill="#183354"><text x="270" y="410" text-anchor="middle" font-size="29" font-weight="700">1 · CALCULATION</text><text x="270" y="445" text-anchor="middle" font-size="21">stated operation</text><text x="560" y="292" text-anchor="middle" font-size="29" font-weight="700">2 · COMPARISON</text><text x="560" y="327" text-anchor="middle" font-size="21">observed dataset</text><text x="840" y="171" text-anchor="middle" font-size="29" font-weight="700">3 · CONCLUSION</text><text x="840" y="206" text-anchor="middle" font-size="21">explanation or action</text><text x="550" y="535" text-anchor="middle" font-size="24" fill="#a06a00">Do not jump from a small dataset to a broad claim.</text></g><path d="M165 330L820 62" stroke="#e6a51c" stroke-width="8"/><path d="M820 62l-24 35 44-10z" fill="#e6a51c"/><text x="475" y="125" transform="rotate(-22 475 125)" font-family="Arial" font-size="22" fill="#53677d">more context + judgement</text></svg>
