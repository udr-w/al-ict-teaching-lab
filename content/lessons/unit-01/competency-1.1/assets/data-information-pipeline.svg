<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" role="img" aria-labelledby="t d"><title id="t">Data to information pipeline</title><desc id="d">Data gains context, is processed for a question and becomes information for a decision.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#e6a51c"/></marker></defs><rect width="1400" height="360" rx="24" fill="#f0f6f8"/><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#fff" stroke="#007f86" stroke-width="4"><rect x="35" y="95" width="265" height="155" rx="18"/><rect x="380" y="95" width="265" height="155" rx="18"/><rect x="725" y="95" width="265" height="155" rx="18"/><rect x="1070" y="95" width="295" height="155" rx="18"/></g><g fill="#183354"><text x="168" y="145" font-size="32" font-weight="700">DATA</text><text x="168" y="187" font-size="23">recorded observations</text><text x="513" y="145" font-size="32" font-weight="700">CONTEXT</text><text x="513" y="183" font-size="21">labels · units</text><text x="513" y="211" font-size="21">time · source</text><text x="858" y="145" font-size="32" font-weight="700">PROCESS</text><text x="858" y="183" font-size="21">chosen to answer</text><text x="858" y="211" font-size="21">the question</text><text x="1218" y="145" font-size="32" font-weight="700">INFORMATION</text><text x="1218" y="183" font-size="21">meaning for a user</text><text x="1218" y="211" font-size="21">and purpose</text></g><g stroke="#e6a51c" stroke-width="8" marker-end="url(#a)"><path d="M305 173H365"/><path d="M650 173H710"/><path d="M995 173H1055"/></g><path d="M1218 260C1218 335 168 335 168 265" fill="none" stroke="#53677d" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#a)"/><rect x="485" y="270" width="430" height="40" rx="18" fill="#f0f6f8"/><text x="700" y="297" fill="#53677d" font-size="21">a decision can create a new question</text></g></svg>
