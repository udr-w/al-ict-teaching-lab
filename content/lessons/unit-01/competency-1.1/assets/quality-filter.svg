<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="t d"><title id="t">Information quality filter</title><desc id="d">Seven quality criteria filter data into trustworthy useful information.</desc><rect width="900" height="600" rx="24" fill="#f0f6f8"/><path d="M100 80H800L575 370V510H325V370Z" fill="#dff3f2" stroke="#007f86" stroke-width="6"/><g font-family="Arial" fill="#183354" text-anchor="middle" font-size="25" font-weight="700"><text x="450" y="125">ACCURATE · COMPLETE · RELEVANT</text><text x="450" y="180">TIMELY · CONSISTENT · CLEAR</text><text x="450" y="235">FIT FOR PURPOSE</text><text x="450" y="420" fill="#007f86">TRUSTWORTHY</text><text x="450" y="456" fill="#007f86">+ USEFUL</text></g><path d="M450 26V65" stroke="#e6a51c" stroke-width="8"/><path d="M450 525V575" stroke="#e6a51c" stroke-width="8"/><text x="450" y="570" text-anchor="middle" font-family="Arial" font-size="21" fill="#53677d">one failed check can change a decision</text></svg>
