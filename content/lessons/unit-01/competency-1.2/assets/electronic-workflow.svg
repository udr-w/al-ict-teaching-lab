<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 450" role="img" aria-labelledby="t d"><title id="t">Electronic information workflow</title><desc id="d">Capture through dissemination remains surrounded by people, procedures and controls.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#e6a51c"/></marker></defs><rect width="1450" height="450" rx="24" fill="#dff3f2" stroke="#007f86" stroke-width="6"/><text x="725" y="48" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#007f86">PEOPLE · PROCEDURES · CONTROLS</text><g font-family="Arial" text-anchor="middle"><g fill="#fff" stroke="#8bb9bd" stroke-width="4"><rect x="35" y="135" width="205" height="150" rx="16"/><rect x="270" y="135" width="205" height="150" rx="16"/><rect x="505" y="135" width="205" height="150" rx="16"/><rect x="740" y="135" width="205" height="150" rx="16"/><rect x="975" y="135" width="205" height="150" rx="16"/><rect x="1210" y="135" width="205" height="150" rx="16"/></g><g fill="#183354" font-size="24" font-weight="700"><text x="138" y="205">CAPTURE</text><text x="373" y="205">VALIDATE</text><text x="608" y="205">PROCESS</text><text x="843" y="205">STORE</text><text x="1078" y="205">RETRIEVE</text><text x="1313" y="205">DISSEMINATE</text></g><g stroke="#e6a51c" stroke-width="7" marker-end="url(#a)"><path d="M242 210H258"/><path d="M477 210H493"/><path d="M712 210H728"/><path d="M947 210H963"/><path d="M1182 210H1198"/></g><text x="725" y="395" fill="#53677d" font-size="24">technology connects the stages; governance surrounds them</text></g></svg>
