<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 420" role="img" aria-labelledby="t d"><title id="t">Manual information workflow</title><desc id="d">Paper records move through reading, copying, calculating, checking and distribution.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#e6a51c"/></marker></defs><rect width="1450" height="420" rx="24" fill="#f0f6f8"/><g font-family="Arial" text-anchor="middle"><g fill="#fff" stroke="#007f86" stroke-width="4"><rect x="30" y="115" width="235" height="145" rx="16"/><rect x="315" y="115" width="235" height="145" rx="16"/><rect x="600" y="115" width="235" height="145" rx="16"/><rect x="885" y="115" width="235" height="145" rx="16"/><rect x="1170" y="115" width="250" height="145" rx="16"/></g><g fill="#183354" font-size="27" font-weight="700"><text x="148" y="175">RECEIVE</text><text x="433" y="175">READ + COPY</text><text x="718" y="175">CALCULATE</text><text x="1003" y="175">CHECK</text><text x="1295" y="175">DISTRIBUTE</text></g><g fill="#53677d" font-size="21"><text x="148" y="215">paper records</text><text x="433" y="215">to tally sheet</text><text x="718" y="215">totals</text><text x="1003" y="215">against originals</text><text x="1295" y="215">make copies</text></g><g stroke="#e6a51c" stroke-width="7" marker-end="url(#a)"><path d="M270 188H300"/><path d="M555 188H585"/><path d="M840 188H870"/><path d="M1125 188H1155"/></g><g fill="#a85d00" font-size="24" font-weight="700"><text x="433" y="90">⚠ TRANSCRIPTION</text><text x="718" y="90">⚠ CALCULATION</text></g><path d="M1003 275C1003 360 433 360 433 275" fill="none" stroke="#53677d" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#a)"/><text x="718" y="388" fill="#53677d" font-size="22">rework when a check fails</text></g></svg>
