<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 430" role="img" aria-labelledby="t d"><title id="t">Convergence of processing and communication</title><desc id="d">Information work moves from isolated processing to connected and mobile communication.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#e6a51c"/></marker></defs><rect width="1450" height="430" rx="24" fill="#f0f6f8"/><g font-family="Arial" text-anchor="middle"><g fill="#fff" stroke="#007f86" stroke-width="5"><rect x="45" y="75" width="385" height="260" rx="20"/><rect x="533" y="75" width="385" height="260" rx="20"/><rect x="1020" y="75" width="385" height="260" rx="20"/></g><g fill="#183354"><text x="238" y="130" font-size="29" font-weight="700">ISOLATED</text><text x="238" y="195" font-size="70">▣</text><text x="238" y="275" font-size="23">process local data</text><text x="725" y="130" font-size="29" font-weight="700">CONNECTED</text><text x="725" y="205" font-size="60">▣—◉—▣</text><text x="725" y="275" font-size="23">share + disseminate</text><text x="1213" y="130" font-size="29" font-weight="700">PORTABLE</text><text x="1213" y="205" font-size="60">▯ ))) ◉</text><text x="1213" y="275" font-size="23">work across locations</text></g><g stroke="#e6a51c" stroke-width="9" marker-end="url(#a)"><path d="M440 205H520"/><path d="M928 205H1007"/></g><text x="725" y="390" font-size="25" fill="#007f86" font-weight="700">PROCESSING + COMMUNICATION</text></g></svg>
