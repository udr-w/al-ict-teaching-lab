<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" role="img" aria-labelledby="t d"><title id="t">Balanced workflow comparison</title><desc id="d">Manual and electronic approaches have different strengths and risks.</desc><rect width="1200" height="570" rx="24" fill="#f0f6f8"/><g font-family="Arial"><rect x="45" y="70" width="510" height="405" rx="22" fill="#fff" stroke="#007f86" stroke-width="5"/><rect x="645" y="70" width="510" height="405" rx="22" fill="#fff" stroke="#007f86" stroke-width="5"/><text x="300" y="125" text-anchor="middle" font-size="34" font-weight="700" fill="#183354">MANUAL</text><text x="900" y="125" text-anchor="middle" font-size="34" font-weight="700" fill="#183354">ELECTRONIC</text><g fill="#53677d" font-size="25"><text x="85" y="185">✓ quick start for a few records</text><text x="85" y="240">✓ flexible with unusual cases</text><text x="85" y="295">✓ can operate without power</text><text x="85" y="365">△ slow for repeated bulk work</text><text x="685" y="185">✓ repeats stated rules quickly</text><text x="685" y="240">✓ searches and reproduces results</text><text x="685" y="295">△ requires setup + controls</text><text x="685" y="365">△ can scale an error quickly</text></g><path d="M470 505H730" stroke="#e6a51c" stroke-width="12"/><circle cx="600" cy="505" r="26" fill="#007f86"/><text x="600" y="550" text-anchor="middle" font-size="22" fill="#183354">requirements decide the balance</text></g></svg>
