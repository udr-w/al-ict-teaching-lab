<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 500" role="img" aria-labelledby="t d"><title id="t">Internet and Web layers</title><desc id="d">Web, email and file transfer use shared Internet infrastructure.</desc><rect width="1400" height="500" rx="24" fill="#f0f6f8"/><g font-family="Arial" text-anchor="middle"><g fill="#fff" stroke="#e6a51c" stroke-width="5"><rect x="80" y="75" width="350" height="150" rx="18"/><rect x="525" y="75" width="350" height="150" rx="18"/><rect x="970" y="75" width="350" height="150" rx="18"/></g><g fill="#183354" font-size="30" font-weight="700"><text x="255" y="140">WORLD WIDE WEB</text><text x="700" y="140">EMAIL</text><text x="1145" y="140">FILE TRANSFER</text></g><g fill="#53677d" font-size="22"><text x="255" y="183">linked web resources</text><text x="700" y="183">another Internet service</text><text x="1145" y="183">another Internet service</text></g><rect x="80" y="305" width="1240" height="125" rx="20" fill="#007f86"/><text x="700" y="360" fill="#fff" font-size="34" font-weight="700">INTERNET INFRASTRUCTURE + PROTOCOLS</text><text x="700" y="401" fill="#fff" font-size="23">interconnected networks · routers · data transport</text><g stroke="#8bb9bd" stroke-width="8"><path d="M255 230V292"/><path d="M700 230V292"/><path d="M1145 230V292"/></g></g></svg>
