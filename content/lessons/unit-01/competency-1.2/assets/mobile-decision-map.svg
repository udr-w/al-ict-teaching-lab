<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" role="img" aria-labelledby="t d"><title id="t">Mobile fieldwork decision map</title><desc id="d">A field task is evaluated for connectivity, battery, privacy, usability and recovery.</desc><rect width="1400" height="520" rx="24" fill="#f0f6f8"/><g font-family="Arial" text-anchor="middle"><circle cx="700" cy="245" r="135" fill="#007f86"/><text x="700" y="215" fill="#fff" font-size="30" font-weight="700">FICTIONAL FIELD</text><text x="700" y="255" fill="#fff" font-size="30" font-weight="700">OFFICER</text><text x="700" y="300" fill="#fff" font-size="23">capture at source</text><g fill="#fff" stroke="#e6a51c" stroke-width="5"><rect x="55" y="65" width="300" height="105" rx="18"/><rect x="55" y="350" width="300" height="105" rx="18"/><rect x="1045" y="65" width="300" height="105" rx="18"/><rect x="1045" y="350" width="300" height="105" rx="18"/><rect x="550" y="395" width="300" height="100" rx="18"/></g><g fill="#183354" font-size="25" font-weight="700"><text x="205" y="128">CONNECTIVITY?</text><text x="205" y="413">BATTERY?</text><text x="1195" y="128">PRIVACY + SECURITY?</text><text x="1195" y="413">SCREEN + INPUT?</text><text x="700" y="455">OFFLINE RECOVERY?</text></g><g stroke="#8bb9bd" stroke-width="5"><path d="M355 150L575 205"/><path d="M355 375L585 295"/><path d="M1045 150L825 205"/><path d="M1045 375L815 295"/><path d="M700 380V395"/></g></g></svg>
