<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 500" role="img" aria-labelledby="t d"><title id="t">Evidence-based workflow decision route</title><desc id="d">Requirements lead to manual, electronic or hybrid workflow choices.</desc><rect width="1450" height="500" rx="24" fill="#f0f6f8"/><g font-family="Arial" text-anchor="middle"><text x="725" y="55" fill="#183354" font-size="30" font-weight="700">CHECK THE REQUIREMENTS</text><g fill="#fff" stroke="#007f86" stroke-width="4"><rect x="55" y="95" width="190" height="90" rx="16"/><rect x="285" y="95" width="190" height="90" rx="16"/><rect x="515" y="95" width="190" height="90" rx="16"/><rect x="745" y="95" width="190" height="90" rx="16"/><rect x="975" y="95" width="190" height="90" rx="16"/><rect x="1205" y="95" width="190" height="90" rx="16"/></g><g fill="#183354" font-size="23" font-weight="700"><text x="150" y="150">VOLUME</text><text x="380" y="150">REPETITION</text><text x="610" y="150">DEADLINE</text><text x="840" y="150">CHECKING</text><text x="1070" y="150">LOCATION</text><text x="1300" y="150">CONSTRAINTS</text></g><path d="M150 205H1300" stroke="#8bb9bd" stroke-width="7"/><path d="M725 205V290" stroke="#e6a51c" stroke-width="10"/><g fill="#007f86"><rect x="95" y="315" width="360" height="115" rx="20"/><rect x="545" y="315" width="360" height="115" rx="20"/><rect x="995" y="315" width="360" height="115" rx="20"/></g><g fill="#fff"><text x="275" y="360" font-size="29" font-weight="700">MANUAL</text><text x="275" y="397" font-size="21">small · flexible · no power</text><text x="725" y="360" font-size="29" font-weight="700">ELECTRONIC</text><text x="725" y="397" font-size="21">controlled · repeated · bulk</text><text x="1175" y="360" font-size="29" font-weight="700">HYBRID</text><text x="1175" y="397" font-size="21">fallback + human review</text></g><text x="725" y="475" fill="#a06a00" font-size="24" font-weight="700">EVIDENCE BEFORE NOVELTY</text></g></svg>
