<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="t d"><title id="t">Error at scale</title><desc id="d">One faulty rule rapidly creates many wrong outputs until a control stops it.</desc><rect width="900" height="600" rx="24" fill="#f0f6f8"/><g font-family="Arial" text-anchor="middle"><rect x="65" y="70" width="260" height="120" rx="18" fill="#a85d00"/><text x="195" y="120" fill="#fff" font-size="27" font-weight="700">FAULTY RULE</text><text x="195" y="158" fill="#fff" font-size="24">+10 instead of +1</text><path d="M330 130H475" stroke="#e6a51c" stroke-width="10"/><path d="M475 130l-30-22v44z" fill="#e6a51c"/><g fill="#ffd8c2" stroke="#a85d00" stroke-width="4"><circle cx="570" cy="130" r="55"/><circle cx="710" cy="90" r="38"/><circle cx="790" cy="170" r="38"/><circle cx="690" cy="230" r="38"/></g><g fill="#183354" font-size="24" font-weight="700"><text x="570" y="139">1</text><text x="710" y="98">10</text><text x="790" y="178">100</text><text x="690" y="238">1000</text></g><rect x="185" y="345" width="530" height="130" rx="18" fill="#dff3f2" stroke="#007f86" stroke-width="6"/><text x="450" y="397" font-size="29" font-weight="700" fill="#007f86">CONTROL GATE</text><text x="450" y="440" font-size="23" fill="#183354">known result · sample · reasonableness</text><path d="M570 275V330" stroke="#007f86" stroke-width="10"/><text x="450" y="545" font-size="24" fill="#53677d">detect → stop → correct → rerun</text></g></svg>
